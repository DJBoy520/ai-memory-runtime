# DSH Cordis patch excerpt: AMR 2.0 adapter through the native stdio shim.
- insert:
    - id: mcp-amr
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: amr
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        command: /home/dj/WorkSpaces/ai-memory-runtime/.venv/bin/python
        args:
          - -m
          - src.interfaces.mcp.bridge2
          - --agent
          - dsh
          - --token-file
          - /home/dj/.config/amr/agents/current/tokens/dsh.token
        env:
          PYTHONPATH: /home/dj/WorkSpaces/ai-memory-runtime
        transport: stdio
